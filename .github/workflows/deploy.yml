name: Despliegue Automatico Footlink

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Checkout del codigo
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar dependencias
        run: npm install --force

      - name: Construir la aplicacion
        env:
          VITE_CARTO_API_KEY: ${{ secrets.VITE_CARTO_API_KEY }}
        run: |
          if [ -z "$VITE_CARTO_API_KEY" ] && [ -f /home/orangepi/Food-link/footlink/.env ]; then
            VAL=$(grep -m1 '^VITE_CARTO_API_KEY=' /home/orangepi/Food-link/footlink/.env | cut -d= -f2- | tr -d '\r"' | sed "s/^'//;s/'$//" || true)
            if [ -n "$VAL" ]; then
              export VITE_CARTO_API_KEY="$VAL"
            fi
          fi
          npm run build

      - name: Desplegar a Nginx
        run: rsync -av --delete ./dist/ /home/orangepi/Food-link/footlink/dist/

      - name: Desplegar servidor API
        run: |
          rsync -av ./server/ /home/orangepi/Food-link/footlink/server/
          pm2 restart foodlink-api || true
