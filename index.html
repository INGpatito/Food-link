<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Foodlink conecta a los comensales con cocinas y obradores locales, visibilizando el origen de los ingredientes y aprovechando los lotes del día para evitar el desperdicio." />
  <meta name="theme-color" content="#181512" />
  <title>FOODLINK — Cocina de proximidad y cero desperdicio</title>
  
  <link rel="stylesheet" href="/src/styles/global.css" /> <!-- Local styles and bundled fonts -->
</head>
<body class="antialiased selection:bg-brand-4 selection:text-white" data-section="hero">
  <div id="noise-overlay"></div>
  <!-- Kept outside #app so its fixed positioning is never captured by the
       perspective used for the DNA transition below. -->
  <div id="navbar-root"></div>

  <!-- UI Container -->0000
  <main class="relative z-20 w-full overflow-hidden" id="app">
    <!-- Hero Section (Burger) -->
    <section id="hero-root" class="relative w-full min-h-[100dvh] flex items-stretch"></section>
    
    <!-- Editorial Section (Pizza) -->
    <section id="features-root" class="relative w-full min-h-[100dvh] flex items-stretch"></section>
    
    <!-- Salad Section (Italian Salad) -->
    <section id="salad-root" class="relative w-full min-h-[100dvh] flex items-stretch"></section>

    <!-- Menu Section (Cake) -->
    <section id="menu-root" class="relative w-full min-h-[100dvh] flex items-stretch"></section>

    <!-- Extra Section (Extra Chocolate) -->
    <section id="extra-root" class="relative w-full min-h-[100dvh] flex items-stretch"></section>

    <!-- Anatomy Section (Exploded Model) -->
    <section id="anatomy-root" class="relative w-full min-h-[130dvh] flex items-stretch"></section>

    <!-- Footer / Final CTA -->
    <section id="footer-root" class="relative w-full py-20"></section>
    
  </main>

  <!-- Login Modal Root -->
  <div id="login-modal-root"></div>

  <!-- Three.js Canvas -->
  <canvas id="webgl-canvas"></canvas>

  <script type="module" src="/src/main.ts"></script> <!-- Main JS entry point -->
</body>
</html><!--- -->
