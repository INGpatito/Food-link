<!DOCTYPE html>
<html lang="es" class="dark scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FOODLINK &mdash; El Arte de Rescatar el Sabor | Red Gastronomica 3D</title>
    <!-- Bundled Stylesheet Entry (Tailwind v4, Typography, Atmosphere, HUD & Morph Cards) -->
    <link rel="stylesheet" href="/src/styles/global.css">
</head>
<body class="text-cream antialiased selection:bg-terracotta/30">
    <!-- Atmospheric Ambient Backdrops -->
    <div class="atmosphere-glow" id="atmosphere-glow"></div>
    <div class="grid-backdrop"></div>
    
    <!-- 3D Canvas Mount Point -->
    <div id="webgl-container" aria-label="Escena 3D interactiva de Foodlink"></div>
    <div class="atmosphere-overlay"></div>

    <!-- UI Mount Points -->
    <!-- Fixed Top Navigation & Brand Identity -->
    <header id="navbar-root"></header>

    <!-- Orbital Morph Layer (4 Quadrants 3D-to-HUD Screen-Space Cards) -->
    <div id="orbital-morph-layer" aria-live="polite"></div>

    <!-- Scroll Storytelling Narrative Stages (#stage-1..4) -->
    <main id="scroll-root"></main>

    <!-- Studio Telemetry & HUD Controls -->
    <aside id="hud-root"></aside>

    <!-- System Modals (Inspect 3D & Kitchen Registration & Login Modal) -->
    <div id="modals-root"></div>
    <div id="login-modal-root"></div>

    <!-- Modular TypeScript Application Entry Point -->
    <script type="module" src="/src/main.ts"></script>
</body>
</html>
